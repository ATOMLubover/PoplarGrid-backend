definitions:
  dto.CreateProjectRequest:
    properties:
      description:
        description: 项目描述，最大长度 512
        type: string
      tags:
        description: 标签列表，最多 5 个标签
        items:
          type: string
        type: array
      title:
        description: 项目标题，必填，最大长度 128
        type: string
      workset_id:
        description: 作品集 ID，必填
        type: integer
    required:
    - title
    - workset_id
    type: object
  dto.ProjectBasic:
    properties:
      id:
        description: 项目 ID
        type: integer
      is_lettered:
        description: 是否已嵌字
        type: boolean
      is_proofed:
        description: 是否已校对
        type: boolean
      is_published:
        description: 是否已发布
        type: boolean
      is_reviewed:
        description: 是否已审核
        type: boolean
      is_translated:
        description: 是否已翻译
        type: boolean
      legacy_id:
        description: 历史遗留序号
        type: integer
      on_lettering:
        description: 是否正在嵌字
        type: boolean
      on_prooving:
        description: 是否正在校对
        type: boolean
      on_reviewing:
        description: 是否正在审核
        type: boolean
      on_translating:
        description: 是否正在翻译
        type: boolean
      title:
        description: 项目名称
        type: string
      workset_id:
        description: 所属作品集 ID
        type: integer
    type: object
  dto.ProjectDetail:
    properties:
      created_at:
        description: 创建时间
        type: string
      description:
        description: 项目描述
        type: string
      id:
        description: 项目 ID
        type: integer
      is_lettered:
        description: 是否已嵌字
        type: boolean
      is_proofed:
        description: 是否已校对
        type: boolean
      is_published:
        description: 是否已发布
        type: boolean
      is_reviewed:
        description: 是否已审核
        type: boolean
      is_translated:
        description: 是否已翻译
        type: boolean
      legacy_id:
        description: 历史遗留序号
        type: integer
      moetran_id:
        description: Moetran ID
        type: string
      on_lettering:
        description: 是否正在嵌字
        type: boolean
      on_prooving:
        description: 是否正在校对
        type: boolean
      on_reviewing:
        description: 是否正在审核
        type: boolean
      on_translating:
        description: 是否正在翻译
        type: boolean
      status:
        description: 项目状态
        type: integer
      tags:
        description: 标签列表
        items:
          type: string
        type: array
      title:
        description: 项目名称
        type: string
      updated_at:
        description: 更新时间
        type: string
      workset_id:
        description: 所属作品集 ID
        type: integer
    type: object
  dto.ProjectStats:
    properties:
      lettered_count:
        description: 已嵌字的项目数量
        type: integer
      lettering_count:
        description: 正在嵌字的项目数量
        type: integer
      prooved_count:
        description: 已校对的项目数量
        type: integer
      prooving_count:
        description: 正在校对的项目数量
        type: integer
      published_count:
        description: 已发布项目数量
        type: integer
      reviewed_count:
        description: 已审核的项目数量
        type: integer
      reviewing_count:
        description: 正在审核的项目数量
        type: integer
      total_count:
        description: 总项目数量
        type: integer
      translated_count:
        description: 已翻译的项目数量
        type: integer
      translating_count:
        description: 正在翻译的项目数量
        type: integer
    type: object
  dto.TagBasic:
    properties:
      description:
        description: 标签描述
        type: string
      id:
        description: 标签 ID
        type: integer
      name:
        description: 标签名称
        type: string
    type: object
  dto.TeamBasic:
    properties:
      id:
        description: 团队 ID
        type: integer
      moetran_id:
        description: Moetran ID
        type: string
      name:
        description: 团队名称
        type: string
    type: object
  dto.WorksetBasic:
    properties:
      id:
        description: 作品集 ID
        type: integer
      moetran_id:
        description: Moetran ID
        type: string
      name:
        description: 作品集名称
        type: string
      team_id:
        description: 所属团队 ID
        type: integer
    type: object
host: localhost:8081
info:
  contact: {}
  description: PoplarGrid API 服务器，提供项目、成员等操作功能
  title: PoplarGrid 核心 API 服务器
  version: "1.0"
paths:
  /project/{id}:
    get:
      description: 获取指定项目的详细信息，包括翻译、校对、嵌字、审核、发布等状态
      parameters:
      - description: 项目 ID
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProjectDetail'
      summary: 获取项目详情
      tags:
      - project
  /project/list:
    get:
      description: 注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: pageSerial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: pageSize
        type: integer
      - description: 排序方式，默认值为 id_desc，支持 id_desc | update_desc，其他输入无效
        in: query
        name: sort
        type: string
      - description: 项目状态，默认为 all，支持 all | translating | translated | prooving | prooved
          | lettering | lettered | published，其他输入无效
        in: query
        name: status
        type: string
      - description: 特定标签，默认为空，表示不筛选
        in: query
        name: tag_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ProjectBasic'
            type: array
      summary: 获取项目列表分页
      tags:
      - project
  /project/proc/create:
    post:
      consumes:
      - application/json
      description: 创建一个新的项目，请求体暂时未确定
      parameters:
      - description: 创建项目的请求体
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 创建项目
      tags:
      - project_proc
  /project/proc/delete:
    delete:
      consumes:
      - multipart/form-data
      description: 删除指定的项目，需提供项目 ID
      parameters:
      - description: 项目 ID
        in: formData
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 删除项目
      tags:
      - project_proc
  /project/proc/status:
    put:
      consumes:
      - multipart/form-data
      description: 更新指定项目的状态，需提供项目 ID 和新的状态（之所以没有 translating 之类的状态，是因为这是翻译等一加入就自动进入的）
      parameters:
      - description: 项目 ID
        in: formData
        name: id
        required: true
        type: string
      - description: 新的项目状态，只能是 translated | prooved | lettered | reviewed | published
        in: formData
        name: status
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 更新项目状态
      tags:
      - project_proc
  /project/proc/update:
    put:
      consumes:
      - multipart/form-data
      description: 更新指定的项目，需提供项目 ID 和更新的字段
      parameters:
      - description: 项目 ID
        in: formData
        name: id
        required: true
        type: string
      - description: 项目标题
        in: formData
        name: title
        type: string
      - description: 项目描述
        in: formData
        name: description
        type: string
      - collectionFormat: csv
        description: 标签列表
        in: formData
        items:
          type: string
        name: tags
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 更新项目
      tags:
      - project_proc
  /project/role/accept:
    post:
      consumes:
      - multipart/form-data
      description: 接受邀请加入项目，需提供邀请的 ID
      parameters:
      - description: 邀请的 ID
        in: formData
        name: invitition_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 接受邀请加入项目
      tags:
      - project_role
  /project/role/accept_appli:
    post:
      consumes:
      - multipart/form-data
      description: 接受申请加入项目，需提供申请的 ID
      parameters:
      - description: 申请的 ID
        in: formData
        name: application_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 接受申请加入项目
      tags:
      - project_role
  /project/role/apply:
    post:
      consumes:
      - multipart/form-data
      description: 申请加入项目，需提供项目 ID 和申请的职位
      parameters:
      - description: 项目 ID
        in: formData
        name: project_id
        required: true
        type: string
      - description: 申请加入的职位
        in: formData
        name: apply_role
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 申请加入项目
      tags:
      - project_role
  /project/role/invite:
    post:
      consumes:
      - multipart/form-data
      description: 邀请成员加入项目，需提供成员的 ID
      parameters:
      - description: 成员的 ID
        in: formData
        name: member_id
        required: true
        type: string
      - description: 邀请加入的职位
        in: formData
        name: invite_role
        required: true
        type: string
      - description: 项目 ID
        in: formData
        name: project_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 邀请成员加入项目
      tags:
      - project_role
  /project/role/refuse:
    post:
      consumes:
      - multipart/form-data
      description: 拒绝邀请加入项目，需提供邀请的 ID
      parameters:
      - description: 邀请的 ID
        in: formData
        name: invitition_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 拒绝邀请加入项目
      tags:
      - project_role
  /project/role/refuse_appli:
    post:
      consumes:
      - multipart/form-data
      description: 拒绝申请加入项目，需提供申请的 ID
      parameters:
      - description: 申请的 ID
        in: formData
        name: application_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 拒绝申请加入项目
      tags:
      - project_role
  /project/stats:
    get:
      description: 获取所有项目的统计信息，包括总数、翻译进行/完成、校对进行/完成、嵌字进行/完成，审核进行/完成、发布完成对应数量等
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.ProjectStats'
      summary: 获取项目统计信息
      tags:
      - project
  /tag/list:
    get:
      description: 注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: pageSerial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: pageSize
        type: integer
      - description: 排序方式，默认值为 id_desc，支持 id_asc | id_desc | poplarity_desc，其他输入无效
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TagBasic'
            type: array
      summary: 获取标签列表分页
      tags:
      - tag
  /team/list:
    get:
      description: 注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: pageSerial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: pageSize
        type: integer
      - description: 排序方式，默认值为 id_desc，支持 id_asc | id_desc，其他输入无效
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.TeamBasic'
            type: array
      summary: 获取汉化组列表分页
      tags:
      - team
  /workset/list:
    get:
      description: 注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: pageSerial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: pageSize
        type: integer
      - description: 排序方式，默认值为 id_desc，支持 id_asc | id_desc | poplarity_desc，其他输入无效
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.WorksetBasic'
            type: array
      summary: 获取工作集列表分页
      tags:
      - workset
swagger: "2.0"
