definitions:
  handlers.ApplicationInfo:
    properties:
      applicant_member_id:
        description: 申请者成员 ID
        type: integer
      applicant_nickname:
        description: 申请者成员昵称
        type: string
      id:
        description: 申请 ID
        type: integer
      processor_member_id:
        description: 处理者成员 ID
        type: integer
      processor_nickname:
        description: 处理者成员昵称
        type: string
      target_labor_mask:
        allOf:
        - $ref: '#/definitions/handlers.LaborMask'
        description: 申请分工掩码
      target_project_id:
        description: 目标项目 ID
        type: integer
      target_project_name:
        description: 目标项目名称
        type: string
      time:
        description: 申请时间
        type: string
    type: object
  handlers.CreateApplicationRequest:
    properties:
      applicant_member_id:
        description: 申请者成员 ID
        type: integer
      target_labor_mask:
        allOf:
        - $ref: '#/definitions/services.LaborMask'
        description: 申请分工掩码
      target_project_id:
        description: 目标项目 ID
        type: integer
    required:
    - applicant_member_id
    - target_labor_mask
    - target_project_id
    type: object
  handlers.CreateInvitationRequest:
    properties:
      invitee_member_id:
        description: 接收者成员 ID
        type: integer
      invitor_member_id:
        description: 邀请者成员 ID
        type: integer
      target_labor_mask:
        allOf:
        - $ref: '#/definitions/services.LaborMask'
        description: 目标分工掩码
      target_project_id:
        description: 目标项目 ID
        type: integer
    required:
    - invitor_member_id
    - target_labor_mask
    - target_project_id
    type: object
  handlers.CreateProjectRequest:
    properties:
      allow_auto_join:
        description: 是否允许自动加入，默认为 false
        type: boolean
      applicant_member_id:
        description: 申请者的成员 ID
        type: integer
      description:
        description: 项目描述
        type: string
      is_hidden:
        description: 是否隐藏项目，默认为 false
        type: boolean
      title:
        description: 项目标题，必填
        type: string
      workset_id:
        description: 作品集 ID，必填
        type: integer
    required:
    - title
    - workset_id
    type: object
  handlers.CreateWorksetRequest:
    properties:
      description:
        description: 工作集描述
        type: string
      name:
        description: 工作集名称
        type: string
      team_id:
        description: 所属团队 ID
        type: integer
    required:
    - name
    - team_id
    type: object
  handlers.ErrorResponse:
    properties:
      detail:
        description: 可选，在 service 层发生错误时提供详细信息
        type: string
      error:
        type: string
    type: object
  handlers.InvitationInfo:
    properties:
      id:
        description: 邀请 ID
        type: integer
      invitee_member_id:
        description: 接收者成员 ID
        type: integer
      invitee_nickname:
        description: 接收者成员昵称
        type: string
      invitor_member_id:
        description: 邀请者成员 ID
        type: integer
      invitor_nickname:
        description: 邀请者成员昵称
        type: string
      target_labor_mask:
        allOf:
        - $ref: '#/definitions/handlers.LaborMask'
        description: 目标分工掩码
      target_project_id:
        description: 目标项目 ID
        type: integer
      target_project_name:
        description: 目标项目名称
        type: string
      time:
        description: 邀请时间
        type: string
    type: object
  handlers.JSONMap:
    additionalProperties: {}
    type: object
  handlers.LaborInfo:
    properties:
      labor_mask:
        allOf:
        - $ref: '#/definitions/handlers.LaborMask'
        description: 分工掩码，使用
      member_id:
        description: 成员 ID
        type: integer
      nickname:
        description: 成员昵称
        type: string
    type: object
  handlers.LaborMask:
    description: 分工掩码与成员在汉化组中的职责相关，使用位掩码表示不同的职责 第 0 位表示监制/负责人 第 1 位表示图源 第 2 位表示美工
      第 3 位表示翻译 第 4 位表示校对 第 5 位表示嵌字 第 6 位表示嵌字审核 第 7 位表示发布
    enum:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    type: integer
    x-enum-comments:
      LABOR_LETTERER_MASK: 嵌字
      LABOR_PERFECTOR_MASK: 美工
      LABOR_PRINCIPAL_MASK: 创建者 + 负责人
      LABOR_PROOFREADER_MASK: 校对
      LABOR_PUBLISHER_MASK: 发布者
      LABOR_REVIEWER_MASK: 嵌字审核
      LABOR_SRC_PROV_MASK: 图源
      LABOR_TRANSLATOR_MASK: 翻译
    x-enum-varnames:
    - LABOR_PRINCIPAL_MASK
    - LABOR_SRC_PROV_MASK
    - LABOR_PERFECTOR_MASK
    - LABOR_TRANSLATOR_MASK
    - LABOR_PROOFREADER_MASK
    - LABOR_LETTERER_MASK
    - LABOR_REVIEWER_MASK
    - LABOR_PUBLISHER_MASK
  handlers.LoginParams:
    properties:
      captcha:
        description: Captcha 是验证码
        type: string
      captcha_info:
        description: CaptchaInfo 是验证码信息
        type: string
      email:
        description: Email 是龙译账号的邮箱
        type: string
      password:
        description: Password 是龙译账号的密码
        type: string
    required:
    - captcha
    - captcha_info
    - email
    - password
    type: object
  handlers.LoginResponse:
    properties:
      token:
        description: MoetranJWT 是登录成功后返回的 JWT token
        type: string
      user:
        allOf:
        - $ref: '#/definitions/handlers.UserInfo'
        description: User 是登录成功后返回的用户信息
    type: object
  handlers.MemberInfo:
    properties:
      id:
        description: 成员 ID
        type: integer
      role:
        allOf:
        - $ref: '#/definitions/handlers.LaborMask'
        description: 在组内的职责（掩码格式）
      team:
        allOf:
        - $ref: '#/definitions/handlers.TeamInfo'
        description: 对应的汉化组信息，可能为空
      user:
        allOf:
        - $ref: '#/definitions/handlers.UserInfo'
        description: 对应的用户信息，可能为空
    type: object
  handlers.ProcessApplicationRequest:
    properties:
      accept:
        description: 是否接受申请
        type: boolean
      application_id:
        description: 申请 ID
        type: integer
      processor_member_id:
        description: 处理者成员 ID
        type: integer
    required:
    - accept
    - application_id
    - processor_member_id
    type: object
  handlers.ProcessInvitationRequest:
    properties:
      accept:
        description: 是否接受邀请
        type: boolean
      invitation_id:
        description: 邀请 ID
        type: integer
      processor_member_id:
        description: 处理者成员 ID
        type: integer
    required:
    - accept
    - invitation_id
    - processor_member_id
    type: object
  handlers.ProjectInfo:
    properties:
      allow_auto_join:
        description: 是否允许自动加入，如果未指定将不会返回
        type: boolean
      description:
        description: 项目描述，如果为空将不会返回
        type: string
      id:
        description: 项目 ID
        type: integer
      labors:
        description: 相关的分工，如果未指定将不会返回
        items:
          $ref: '#/definitions/handlers.LaborInfo'
        type: array
      legacy_id:
        description: Legacy ID，如果未指定将不会返回
        type: integer
      moetran_id:
        description: 龙译 ID
        type: string
      moetran_project_info:
        description: 尨译项目的信息，直接以 string 形式返回，后端不做解析
        type: string
      status:
        description: 项目状态，使用位掩码表示
        type: integer
      title:
        description: 项目标题
        type: string
      workset_id:
        description: 作品集 ID
        type: integer
      workset_index:
        description: 作品集索引
        type: integer
    type: object
  handlers.SuccessResponse:
    properties:
      detail:
        allOf:
        - $ref: '#/definitions/handlers.JSONMap'
        description: 可选，提供额外的成功信息
      message:
        type: string
    type: object
  handlers.TeamInfo:
    properties:
      description:
        description: 汉化组描述
        type: string
      id:
        description: 汉化组 ID
        type: integer
      moetran_id:
        description: 汉化组对应的龙译 ID
        type: string
      name:
        description: 汉化组名称
        type: string
    type: object
  handlers.UpdateProjectRequest:
    properties:
      description:
        description: 项目描述
        type: string
      operator_member_id:
        description: 操作成员的 ID，即进行更新这个操作的成员 ID
        type: integer
      status:
        description: 项目状态，使用位掩码表示，不使用的未应当使用 0b11 填充
        type: integer
      title:
        description: 项目标题
        type: string
    type: object
  handlers.UserInfo:
    properties:
      email:
        description: 邮箱
        type: string
      id:
        description: 用户 ID
        type: integer
      is_admin:
        description: 是否是 panel 管理员
        type: boolean
      members:
        description: 在各个汉化组中的成员信息
        items:
          $ref: '#/definitions/handlers.MemberInfo'
        type: array
      moetran_id:
        description: 龙译 ID
        type: string
      moetran_jwt:
        description: 龙译 JWT
        type: string
      nickname:
        description: 昵称
        type: string
      qq_number:
        description: QQ 号
        type: integer
      remark:
        description: 补充备注
        type: string
    type: object
  handlers.WorksetInfo:
    properties:
      created_at:
        description: 工作集的创建时间
        type: string
      description:
        description: 工作集描述
        type: string
      id:
        description: 工作集 ID
        type: integer
      moetran_id:
        description: 工作集对应的龙译 ID
        type: string
      name:
        description: 工作集名称
        type: string
    type: object
  handlers.WorksetStats:
    properties:
      lettered_count:
        description: 嵌字完成的项目数量
        type: integer
      not_lettering_count:
        description: 未开始嵌字的项目数量
        type: integer
      not_proofreading_count:
        description: 未开始校对的项目数量
        type: integer
      not_reviewing_count:
        description: 未开始审核的项目数量
        type: integer
      not_translating_count:
        description: 未开始翻译的项目数量
        type: integer
      on_lettering_count:
        description: 嵌字中的项目数量
        type: integer
      on_proofreading_count:
        description: 校对中的项目数量
        type: integer
      on_reviewing_count:
        description: 审核中的项目数量
        type: integer
      on_translating_count:
        description: 翻译中的项目数量
        type: integer
      proofread_count:
        description: 校对完成的项目数量
        type: integer
      published_count:
        description: 已发布的项目数量
        type: integer
      reviewed_count:
        description: 审核完成的项目数量
        type: integer
      total_project_count:
        description: 总项目数量
        type: integer
      translated_count:
        description: 翻译完成的项目数量
        type: integer
      workset_id:
        description: 作品集 ID
        type: integer
    type: object
  services.LaborMask:
    description: 分工掩码与成员在汉化组中的职责相关，使用位掩码表示不同的职责 第 0 位表示监制/负责人 第 1 位表示图源 第 2 位表示美工
      第 3 位表示翻译 第 4 位表示校对 第 5 位表示嵌字 第 6 位表示嵌字审核 第 7 位表示发布
    enum:
    - 1
    - 2
    - 4
    - 8
    - 16
    - 32
    - 64
    - 128
    type: integer
    x-enum-comments:
      LABOR_LETTERER_MASK: 嵌字
      LABOR_PERFECTOR_MASK: 美工
      LABOR_PRINCIPAL_MASK: 创建者 + 负责人
      LABOR_PROOFREADER_MASK: 校对
      LABOR_PUBLISHER_MASK: 发布者
      LABOR_REVIEWER_MASK: 嵌字审核
      LABOR_SRC_PROV_MASK: 图源
      LABOR_TRANSLATOR_MASK: 翻译
    x-enum-varnames:
    - LABOR_PRINCIPAL_MASK
    - LABOR_SRC_PROV_MASK
    - LABOR_PERFECTOR_MASK
    - LABOR_TRANSLATOR_MASK
    - LABOR_PROOFREADER_MASK
    - LABOR_LETTERER_MASK
    - LABOR_REVIEWER_MASK
    - LABOR_PUBLISHER_MASK
host: localhost:8081
info:
  contact: {}
  description: PoplarGrid API 服务器，提供项目、成员等操作功能
  title: PoplarGrid 核心 API 服务器
  version: "1.0"
paths:
  /api/applications:
    get:
      description: 获取当前用户的申请列表，根据参数的选择来确定到底是返回申请者的申请还是处理者的申请
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: page_serial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: page_size
        type: integer
      - description: 申请人的成员 ID，与处理者的成员 ID 只能二选一
        in: query
        name: applicant_member_id
        type: integer
      - description: 处理者的成员 ID，与申请人的成员 ID 只能二选一
        in: query
        name: processor_member_id
        type: integer
      - description: 目标项目 ID，如果需要筛选特定项目的申请，可以使用此参数
        in: query
        name: target_project_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ApplicationInfo'
            type: array
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取申请列表
      tags:
      - application
    post:
      consumes:
      - application/json
      description: 创建一个新的申请记录
      parameters:
      - description: 申请的基本信息
        in: body
        name: body_params
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 创建申请
      tags:
      - application
  /api/applications/{id}:
    put:
      consumes:
      - application/json
      description: 接受或拒绝申请
      parameters:
      - description: 申请 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 处理申请的请求参数
        in: body
        name: body_params
        required: true
        schema:
          $ref: '#/definitions/handlers.ProcessApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 处理成功
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 处理申请
      tags:
      - application
  /api/invitations:
    get:
      description: 获取当前用户的邀请列表，通过参数的选择来确定到底是返回邀请者的邀请还是被邀请者的邀请
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: page_serial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: page_size
        type: integer
      - description: 邀请人的成员 ID，与被邀请人的成员 ID 只能二选一
        in: query
        name: invitor_member_id
        type: integer
      - description: 被邀请人的成员 ID，与邀请人的成员 ID 只能二选一
        in: query
        name: invitee_member_id
        type: integer
      - description: 目标项目 ID，如果需要筛选特定项目的邀请，可以使用此参数
        in: query
        name: target_project_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.InvitationInfo'
            type: array
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取邀请列表
      tags:
      - invitation
    post:
      consumes:
      - application/json
      description: 创建一个新的邀请记录
      parameters:
      - description: 邀请的基本信息
        in: body
        name: body_params
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 创建邀请
      tags:
      - invitation
  /api/invitations/{id}:
    put:
      consumes:
      - application/json
      description: 接受或拒绝邀请
      parameters:
      - description: 邀请 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 处理邀请的请求参数
        in: body
        name: body_params
        required: true
        schema:
          $ref: '#/definitions/handlers.ProcessInvitationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 处理成功
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 处理邀请
      tags:
      - invitation
  /api/members:
    get:
      description: 获取指定汉化组的成员列表，注意当列表为空，会返回 null 而不是空数组
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: page_serial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: page_size
        type: integer
      - description: 汉化组 ID
        in: query
        name: team_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.MemberInfo'
            type: array
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取指定汉化组的成员列表
      tags:
      - member
  /api/projects:
    get:
      description: 根据作品集 ID 获取项目列表，支持分页、排序和状态筛选。当列表为空时，会返回 null 而不是空数组。
      parameters:
      - description: 页码，默认值为 1
        in: query
        name: page_serial
        type: integer
      - description: 每页数量，默认值为 10
        in: query
        name: page_size
        type: integer
      - description: 项目状态（位掩码），用于复合查询，可以有多个 status，默认不筛选
        in: query
        name: status_mask
        type: integer
      - description: 成员 ID，默认不筛选成员
        in: query
        name: member_id
        type: integer
      - description: 项目所属的作品集 ID，默认不筛选
        in: query
        name: workset_id
        type: integer
      - description: 项目的 workset index 或 legacy ID，默认不筛选
        in: query
        name: index
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.ProjectInfo'
            type: array
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 获取项目列表分页
      tags:
      - project
    post:
      consumes:
      - application/json
      description: 创建一个新的项目
      parameters:
      - description: 创建项目的请求体
        in: body
        name: body_params
        required: true
        schema:
          $ref: '#/definitions/handlers.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/handlers.SuccessResponse'
        "400":
          description: 无效的请求参数
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 创建项目
