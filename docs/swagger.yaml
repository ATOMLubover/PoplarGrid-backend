basePath: /api/v1
definitions:
  main.GreetRequest:
    properties:
      language:
        enum:
        - en
        - es
        - fr
        example: en
        type: string
      name:
        example: John
        type: string
    required:
    - name
    type: object
  main.GreetResponse:
    properties:
      message:
        example: Hello John!
        type: string
      status:
        example: 200
        type: integer
    type: object
  main.HealthCheckResponse:
    properties:
      status:
        example: OK
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: A complete runnable Swagger integration example
  title: Iris Swagger API
  version: "1.0"
paths:
  /greet:
    post:
      consumes:
      - application/json
      description: Generates a greeting based on name and language
      parameters:
      - description: Request parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/main.GreetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.GreetResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Generate greeting
      tags:
      - User
  /health:
    get:
      description: Checks the service status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/main.HealthCheckResponse'
      summary: Service health check
      tags:
      - System
swagger: "2.0"
