# 总体服务器配置
server:
  # 启动模式 (比如 "debug", "release")
  mode: "debug"

# 服务器配置
database:
  # 数据库类型，目前只支持 PostgreSQL
  type: "postgresql"
  host: "172.21.144.1"
  port: 5432
  user: "postgres"
  # 为了提高安全性，密码可以通过环境变量传递
  pwd_env_var: "DB_PASSWORD"
  # 数据库名称
  db_name: "poplar"
  # 是否启用 SSL，“disable”表示不启用，“enable”表示启用
  ssl_enabled: "disable"
  # 连接超时时间（秒）
  connect_timeout: 10

# 尨译 API 配置
api:
  # 尨译 API 基础 URL
  base_url: "https://api.moetran.com"
