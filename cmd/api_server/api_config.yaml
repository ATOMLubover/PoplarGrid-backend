# 总体服务器配置
server:
  # 启动模式 (比如 "debug", "release")
  mode: "debug"
  # 监听端口
  port: 8081 

  # 跨域设置
  cors_origins: 
    - "http://localhost:3000"
  cors_methods: 
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    - "PATCH"
  cors_headers: 
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  cors_with_credentials: true
  # 跨域预检请求的最大缓存时间（单位：秒）
  cors_max_age: 3600

database:
  # 数据库类型，目前只支持 PostgreSQL
  type: "postgresql"
  host: "172.21.144.1"
  port: 5432
  user: "postgres"
  # 为了提高安全性，密码可以通过环境变量传递
  pwd_env_var: "DB_PASSWORD"
  # 数据库名称
  db_name: "poplar"
  # 是否启用 SSL，“disable”表示不启用，“enable”表示启用
  ssl_enabled: "disable"
  # 连接超时时间（秒）
  connect_timeout: 10

api:
  # 尨译 API 基础 URL (请替换为实际的 URL)
  base_url: "http://api.moetran.com/v1" 
  # 尨译 API 的授权 Token（初始化时）
  auth_token: ""

jwt:
  # JWT 密钥
  secret_key: "priestess"
  # JWT 过期时间（单位：秒）
  expire_time: 3600